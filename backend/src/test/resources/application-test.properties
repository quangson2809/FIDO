spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:fido;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${TEST_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
app.cors.allowed-origins=http://localhost:5173

# Deliberately public, test-only key; never loaded outside the test profile.
app.jwt.secret-base64=dGVzdC1vbmx5LXNpZ25pbmcta2V5LW5vdC1mb3ItcHJvZHVjdGlvbg==
app.bootstrap.enabled=false

# Isolated fixtures for the test profile (never used for normal runtime).
server.port=0
app.jwt.issuer=fido
app.jwt.ttl-seconds=900
app.checkout.shipping-fee=30000.00
spring.servlet.multipart.max-file-size=32MB
spring.servlet.multipart.max-request-size=64MB
app.image-storage.max-upload-size=32MB
app.image-storage.max-files-per-request=10
app.image-storage.imgbb.base-url=https://api.imgbb.com
app.image-storage.imgbb.connect-timeout=5s
app.image-storage.imgbb.read-timeout=20s
