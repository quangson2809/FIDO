spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fido?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
logging.level.org.springframework.web=INFO


# Public local-development signing key only.
# Safe to commit because it is not a production secret.
# Override with JWT_SECRET_BASE64 for any shared/staging/production environment.
app.jwt.secret-base64=${JWT_SECRET_BASE64:Zmlkby1sb2NhbC1kZXYtc2lnbmluZy1rZXktZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9uLTIwMjY=}
app.jwt.issuer=${JWT_ISSUER:fido}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:900}

# Deterministic 28-table local dataset for Postman/manual development testing.
# Opt-in so an existing developer database is never modified unexpectedly.
app.dev-seed.enabled=${DEV_SEED_ENABLED:false}
