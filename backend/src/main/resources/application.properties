spring.application.name=fido-backend
spring.config.import=optional:file:.env[.properties]
# The .env file supplies the profile for local bootRun; deployment may use OS environment.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}
server.port=${SERVER_PORT:}
# Non-dev profiles must supply their database configuration explicitly.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/swagger-ui.html

# Required on every runtime profile: stable, private, random >=32-byte Base64 signing key.
app.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.jwt.issuer=${JWT_ISSUER:}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:}
app.bootstrap.enabled=${SUPERADMIN_BOOTSTRAP_ENABLED:false}
app.bootstrap.phone=${SUPERADMIN_PHONE:}
app.bootstrap.password=${SUPERADMIN_PASSWORD:}
spring.jackson.deserialization.fail-on-unknown-properties=true

app.checkout.shipping-fee=${CHECKOUT_SHIPPING_FEE:}

# Backend-only image storage configuration. Never expose provider credentials to frontend/API contracts.
spring.servlet.multipart.max-file-size=${IMAGE_STORAGE_MAX_UPLOAD_SIZE:}
spring.servlet.multipart.max-request-size=${IMAGE_STORAGE_MAX_REQUEST_SIZE:}
app.image-storage.max-upload-size=${IMAGE_STORAGE_MAX_UPLOAD_SIZE:}
app.image-storage.max-files-per-request=${IMAGE_STORAGE_MAX_FILES_PER_REQUEST:}
app.image-storage.imgbb.api-key=${IMGBB_API_KEY:}
app.image-storage.imgbb.base-url=${IMGBB_BASE_URL:}
app.image-storage.imgbb.connect-timeout=${IMGBB_CONNECT_TIMEOUT:}
app.image-storage.imgbb.read-timeout=${IMGBB_READ_TIMEOUT:}

# CORS policy values are supplied by the running environment.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
