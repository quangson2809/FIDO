spring.application.name=fido-backend
spring.profiles.default=dev
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8080}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/swagger-ui.html

# No development signing-key fallback. Supply a stable random >=32-byte Base64 key.
app.jwt.secret-base64=
app.jwt.issuer=fido
app.jwt.ttl-seconds=900
app.bootstrap.enabled=false
app.bootstrap.phone=
app.bootstrap.password=
spring.jackson.deserialization.fail-on-unknown-properties=true

app.checkout.shipping-fee=30000.00
