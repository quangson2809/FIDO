name: Temporary FE and BE formatting pass

on:
  push:
    branches:
      - feature/cart-checkout-voucher-improvements
    paths:
      - ".github/workflows/format-code.yml"

permissions:
  contents: write

jobs:
  format:
    name: Format existing frontend and backend code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: feature/cart-checkout-voucher-improvements

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Format frontend TypeScript, TSX, JavaScript, CSS and HTML
        working-directory: frontend
        run: >-
          npx --yes prettier@3.6.2 --write --single-quote
          --trailing-comma all --print-width 100 --no-error-on-unmatched-pattern
          "src/**/*.{ts,tsx,js,jsx,css}"
          "tests/**/*.{ts,tsx,js,jsx,mjs}"
          "*.ts" "*.js" "*.html"

      - name: Set up Java for formatter
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Format backend Java source and tests
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/google/google-java-format/releases/download/v1.28.0/google-java-format-1.28.0-all-deps.jar \
            --output /tmp/google-java-format.jar
          find backend/src -type f -name '*.java' -print0 \
            | xargs -0 java -jar /tmp/google-java-format.jar --aosp --replace

      - name: Validate whitespace and commit formatted source only
        shell: bash
        run: |
          git diff --check
          git status --short
          if git diff --quiet -- frontend/src frontend/tests backend/src; then
            echo "No formatting changes were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src frontend/tests backend/src
          git commit -m "style: format frontend and backend code [skip-format]"
          git push origin HEAD:feature/cart-checkout-voucher-improvements
