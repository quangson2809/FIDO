name: Clean Schema Reset target verification

on:
  push:
    branches:
      - feature/clean-schema-reset
    paths:
      - "backend/src/main/resources/db/clean-reset/**"
      - "backend/src/test/java/com/fido/persistence/CleanResetSchemaTests.java"
      - ".github/workflows/clean-reset-schema-verification.yml"
  pull_request:
    branches:
      - demo1
      - docs/phase-1-erd-v2-freeze
    paths:
      - "backend/src/main/resources/db/clean-reset/**"
      - "backend/src/test/java/com/fido/persistence/CleanResetSchemaTests.java"
      - "backend/src/test/resources/clean-reset/**"
      - ".github/workflows/clean-reset-schema-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-reset-schema-${{ github.ref }}
  cancel-in-progress: true

jobs:
  target-schema:
    name: Verify target schema from an empty database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run clean-target schema tests
        working-directory: backend
        run: ./gradlew test --tests com.fido.persistence.CleanResetSchemaTests
