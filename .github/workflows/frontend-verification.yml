name: Frontend verification
# FE-P5 Frontend integration and acceptance verification.

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-verification.yml"
  pull_request:
    branches:
      - main
      - demo1
      - feature/customer-shopping-journey-ux-improvements
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ORDER_MODEL_FOCUSED: ${{ github.ref == 'refs/heads/refactor/domain-entity-behaviors' || github.head_ref == 'refactor/domain-entity-behaviors' }}
  CUSTOMER_CANCEL_FOCUSED: ${{ contains(github.event.head_commit.message, '[customer-cancel-focus]') || contains(github.event.pull_request.title, '[customer-cancel-focus]') }}
  IMAGE_FOCUSED: ${{ contains(github.event.head_commit.message, '[product-images-focus]') || contains(github.event.pull_request.title, '[product-images-focus]') }}
  REPORT_FOCUSED: ${{ contains(github.event.head_commit.message, '[admin-report-focus]') || contains(github.event.pull_request.title, '[admin-report-focus]') }}

concurrency:
  group: frontend-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, typecheck and build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck and production build
        working-directory: frontend
        run: npm run build
      - name: Keep production build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  frontend:
    name: Option-only API, render and browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: API integration smoke
        if: env.REPORT_FOCUSED != 'true' && env.IMAGE_FOCUSED != 'true'
        working-directory: frontend
        run: npm run test:api

      - name: Frontend architecture smoke
        if: env.REPORT_FOCUSED != 'true' && env.IMAGE_FOCUSED != 'true'
        working-directory: frontend
        run: npm run test:architecture

      - name: Product color and size selection
        if: env.REPORT_FOCUSED != 'true' && env.IMAGE_FOCUSED != 'true' && env.CUSTOMER_CANCEL_FOCUSED != 'true' && env.ORDER_MODEL_FOCUSED != 'true'
        working-directory: frontend
        run: npm run test:selection

      - name: Frontend render smoke
        if: env.REPORT_FOCUSED != 'true' && env.IMAGE_FOCUSED != 'true' && env.ORDER_MODEL_FOCUSED != 'true'
        working-directory: frontend
        run: npm run test:render

      - name: Focused report calculations and contracts
        if: env.REPORT_FOCUSED == 'true'
        working-directory: frontend
        run: npm run test:reports

      - name: Install Chromium for browser verification
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Customer browser journeys and responsive checks
        working-directory: frontend
        run: |
          if [ "$ORDER_MODEL_FOCUSED" = "true" ]; then
            node tests/customer-order-cancel-browser.mjs
            node tests/checkout-flow.mjs
          elif [ "$CUSTOMER_CANCEL_FOCUSED" = "true" ]; then
            npm run test:order-cancel-browser
          elif [ "$IMAGE_FOCUSED" = "true" ]; then
            node tests/admin-product-management-browser.mjs --images-only
          elif [ "$REPORT_FOCUSED" = "true" ]; then
            node tests/report-browser-smoke.mjs
          else
            npm run test:browser
          fi

      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-browser-evidence
          path: frontend/.browser-evidence
          include-hidden-files: true
          if-no-files-found: warn

