name: Frontend verification

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-verification.yml"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint, typecheck and build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: API integration smoke
        working-directory: frontend
        run: npm run test:api

      - name: Frontend architecture smoke
        working-directory: frontend
        run: npm run test:architecture

      - name: Frontend render smoke
        working-directory: frontend
        run: npm run test:render

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

      - name: Install Chromium for browser verification
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Customer browser journeys and responsive checks
        working-directory: frontend
        run: npm run test:browser

      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-browser-evidence
          path: frontend/.browser-evidence
          if-no-files-found: warn

      - name: Keep production build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
