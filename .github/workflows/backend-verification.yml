name: Backend quality gate

on:
  push:
    branches:
      - feature/backend-phase-0-discovery
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: fido-backend-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Scope / backend
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.scope.outputs.backend_changed }}
    steps:
      - name: Resolve backend scope
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event.pull_request.base.ref }}" != "main" ]; then
            echo "backend_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename')"

          if printf '%s\n' "$files" | grep -Eq '^(backend/|\.quality/|\.github/workflows/backend-verification\.yml$)'; then
            echo "backend_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_changed=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Technical / backend
    needs: scope
    if: needs.scope.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: fido_test
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build and test with H2
        working-directory: backend
        run: ./gradlew --no-daemon clean build

      - name: Keep H2 test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-h2-test-reports-${{ github.run_id }}
          path: backend/build/test-results/test

      - name: Test migration and mapping with MySQL
        id: mysql-tests
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/fido_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          TEST_DB_DRIVER: com.mysql.cj.jdbc.Driver
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: ci-only-password
        run: ./gradlew --no-daemon test --rerun-tasks

      - name: Keep MySQL test reports
        if: always() && steps.mysql-tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: backend-mysql-test-reports-${{ github.run_id }}
          path: backend/build/test-results/test

  structure-review:
    name: Review / structure
    needs: scope
    if: >-
      needs.scope.outputs.backend_changed == 'true' &&
      (github.event_name == 'pull_request' || github.event_name == 'pull_request_review')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate independent Work review for current head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .quality/validate_work_review.py

  quality-gate:
    name: Backend Quality Gate / final
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'pull_request_review')
    runs-on: ubuntu-latest
    needs:
      - scope
      - backend
      - structure-review
    steps:
      - name: Enforce technical and structural gates
        env:
          BACKEND_CHANGED: ${{ needs.scope.outputs.backend_changed }}
          BACKEND: ${{ needs.backend.result }}
          STRUCTURE: ${{ needs.structure-review.result }}
        shell: bash
        run: |
          echo "backend_changed=$BACKEND_CHANGED"
          echo "backend=$BACKEND"
          echo "structure=$STRUCTURE"

          if [ "$BACKEND_CHANGED" != "true" ]; then
            echo "FINAL RESULT: PASS (backend not affected)"
            exit 0
          fi

          if [ "$BACKEND" != "success" ] || [ "$STRUCTURE" != "success" ]; then
            echo "FINAL RESULT: FAIL"
            exit 1
          fi

          echo "FINAL RESULT: PASS"
