name: Backend verification

on:
  push:
    branches:
      - feature/p3-1-account-rbac
      - feature/catalog-product-attributes-backend
      - work/p3-16-consolidated
      - demo1
      - feature/backend-phase-0-discovery
      - feature/phase-2-3-image-persistence
      - fix/backend-confirmed-findings-20261007
      - fix/frontend-product-variant-selection
      - feature/admin-ui-ux-improvements
      - feature/cart-checkout-voucher-improvements
      - feature/customer-shopping-journey-ux-improvements
      - feature/admin-dashboard-analytics
      - feature/client-storefront-ui-ux-improvements
      - "fix/**"
  pull_request:
    branches:
      - main
      - demo1
    paths:
      - "backend/**"
      - "reference/**"
      - "docs/refactor-v2/p1/P1-exit-gate.md"
      - "docs/refactor-v2/p1/P1.9-contract-consistency-report.md"
      - "docs/refactor-v2/p1/P1-traceability-matrix.csv"
      - "docs/refactor-v2/p1/P1-owner-amendment-2026-10-25.md"
      - ".github/workflows/backend-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-runtime:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/p3-1-account-rbac'
    name: Compile production source and start runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: fido_runtime
          MYSQL_ROOT_PASSWORD: ci-only-password
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/fido_runtime?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: dev
      DEV_SEED_ENABLED: "true"
      JWT_SECRET_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      JWT_ISSUER: fido-ci
      JWT_TTL_SECONDS: "900"
      CHECKOUT_SHIPPING_FEE: "30000"
      IMAGE_STORAGE_MAX_UPLOAD_SIZE: 32MB
      IMAGE_STORAGE_MAX_REQUEST_SIZE: 64MB
      IMAGE_STORAGE_MAX_FILES_PER_REQUEST: "10"
      IMGBB_BASE_URL: https://api.imgbb.com
      IMGBB_CONNECT_TIMEOUT: 5s
      IMGBB_READ_TIMEOUT: 20s
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Compile production source only
        working-directory: backend
        run: ./gradlew --no-daemon clean compileJava
      - name: Start main runtime, execute dev seed, and verify actuator health
        working-directory: backend
        shell: bash
        run: |
          set -uo pipefail
          ./gradlew --no-daemon bootRun > "$RUNNER_TEMP/fido-boot.log" 2>&1 &
          BOOT_PID=$!
          cleanup() {
            kill "$BOOT_PID" 2>/dev/null || true
            wait "$BOOT_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 90); do
            if curl --silent --show-error --fail http://127.0.0.1:8080/actuator/health >/dev/null \
                && grep -Fq "FIDO development seed completed and validated against target schema" "$RUNNER_TEMP/fido-boot.log"; then
              echo "Main runtime started, target-schema development seed completed, and actuator health is reachable."
              exit 0
            fi
            if ! kill -0 "$BOOT_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/fido-boot.log"
              exit 1
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/fido-boot.log"
          exit 1

  backend:
    if: ${{ !((github.event_name == 'push' && github.ref == 'refs/heads/feature/p3-1-account-rbac') || (github.event_name == 'pull_request' && github.head_ref == 'feature/p3-1-account-rbac')) }}
    name: Build and test backend
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: fido_test
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Compile backend and test sources
        working-directory: backend
        run: ./gradlew --no-daemon clean compileJava compileTestJava
      - name: Test migration and mapping with MySQL
        id: mysql-tests
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/fido_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          TEST_DB_DRIVER: com.mysql.cj.jdbc.Driver
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: ci-only-password
        run: ./gradlew --no-daemon compileJava test check --rerun-tasks
      - name: Keep MySQL test reports
        if: always() && steps.mysql-tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: backend-mysql-test-reports
          path: backend/build/test-results/test
