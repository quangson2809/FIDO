name: Backend verification

on:
  push:
    branches:
      - feature/p3-1-account-rbac
      - feature/catalog-product-attributes-backend
      - work/p3-16-consolidated
      - demo1
      - feature/catalog-dynamic-sku-selection
      - refactor/backend-pattern-safe-v2
      - refactor/domain-entity-behaviors
      - feature/backend-phase-0-discovery
      - feature/phase-2-3-image-persistence
      - fix/backend-confirmed-findings-20261007
      - fix/frontend-product-variant-selection
      - feature/admin-ui-ux-improvements
      - feature/cart-checkout-voucher-improvements
      - feature/customer-shopping-journey-ux-improvements
      - feature/admin-dashboard-analytics
      - feature/client-storefront-ui-ux-improvements
      - "fix/**"
  pull_request:
    branches:
      - main
      - demo1
    paths:
      - "backend/**"
      - "ops/sql/**"
      - "reference/**"
      - "docs/refactor-v2/p1/P1-exit-gate.md"
      - "docs/refactor-v2/p1/P1.9-contract-consistency-report.md"
      - "docs/refactor-v2/p1/P1-traceability-matrix.csv"
      - "docs/refactor-v2/p1/P1-owner-amendment-2026-10-25.md"
      - ".github/workflows/backend-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VIETNAMESE_ERRORS_FOCUSED: ${{ contains(github.event.head_commit.message, '[vietnamese-errors-focus]') || contains(github.event.pull_request.title, '[vietnamese-errors-focus]') }}
  DOMAIN_ENTITY_FOCUSED: ${{ github.ref == 'refs/heads/refactor/domain-entity-behaviors' || github.head_ref == 'refactor/domain-entity-behaviors' }}
  CUSTOMER_CANCEL_FOCUSED: ${{ contains(github.event.head_commit.message, '[customer-cancel-focus]') || contains(github.event.pull_request.title, '[customer-cancel-focus]') }}
  SEED_CATALOG_FOCUSED: ${{ contains(github.event.head_commit.message, '[seed-catalog-focus]') || contains(github.event.pull_request.title, '[seed-catalog-focus]') }}
  REPORT_FOCUSED: ${{ contains(github.event.head_commit.message, '[admin-report-focus]') || contains(github.event.pull_request.title, '[admin-report-focus]') }}

jobs:
  backend-runtime:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/p3-1-account-rbac'
    name: Compile production source and start runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: fido_runtime
          MYSQL_ROOT_PASSWORD: ci-only-password
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/fido_runtime?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: dev
      DEV_SEED_ENABLED: "true"
      JWT_SECRET_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      JWT_ISSUER: fido-ci
      JWT_TTL_SECONDS: "900"
      CHECKOUT_SHIPPING_FEE: "30000"
      IMAGE_STORAGE_MAX_UPLOAD_SIZE: 32MB
      IMAGE_STORAGE_MAX_REQUEST_SIZE: 64MB
      IMAGE_STORAGE_MAX_FILES_PER_REQUEST: "10"
      IMGBB_BASE_URL: https://api.imgbb.com
      IMGBB_CONNECT_TIMEOUT: 5s
      IMGBB_READ_TIMEOUT: 20s
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Compile production source only
        working-directory: backend
        run: ./gradlew --no-daemon clean compileJava
      - name: Start main runtime, execute dev seed, and verify actuator health
        working-directory: backend
        shell: bash
        run: |
          set -uo pipefail
          ./gradlew --no-daemon bootRun > "$RUNNER_TEMP/fido-boot.log" 2>&1 &
          BOOT_PID=$!
          cleanup() {
            kill "$BOOT_PID" 2>/dev/null || true
            wait "$BOOT_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 90); do
            if curl --silent --show-error --fail http://127.0.0.1:8080/actuator/health >/dev/null \
                && grep -Fq "FIDO development seed completed and validated against target schema" "$RUNNER_TEMP/fido-boot.log"; then
              echo "Main runtime started, target-schema development seed completed, and actuator health is reachable."
              exit 0
            fi
            if ! kill -0 "$BOOT_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/fido-boot.log"
              exit 1
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/fido-boot.log"
          exit 1

  backend:
    if: ${{ !contains(github.event.head_commit.message, '[product-images-focus]') && !contains(github.event.pull_request.title, '[product-images-focus]') && !((github.event_name == 'push' && github.ref == 'refs/heads/feature/p3-1-account-rbac') || (github.event_name == 'pull_request' && github.head_ref == 'feature/p3-1-account-rbac')) }}
    name: Build and test backend
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: fido_test
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Compile backend and test sources
        working-directory: backend
        run: ./gradlew --no-daemon clean compileJava compileTestJava
      # Kiểm tra các cụm vừa thay đổi trước khi chạy bộ backend/MySQL đầy đủ.
      - name: Focused backend regression tests
        if: github.ref == 'refs/heads/refactor/backend-pattern-safe-v2' && env.REPORT_FOCUSED != 'true'
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/fido_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          TEST_DB_DRIVER: com.mysql.cj.jdbc.Driver
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: ci-only-password
        run: |
          ./gradlew --no-daemon test --rerun-tasks \
            --tests com.fido.common.ArchitectureBoundaryTests \
            --tests com.fido.modules.audit.service.AuditPayloadPolicyTests \
            --tests com.fido.modules.audit.AuditWriteServiceTransactionTests \
            --tests com.fido.modules.audit.AuditQueryApiTest \
            --tests com.fido.modules.inventory.InventoryAdjustmentHttpTests \
            --tests com.fido.modules.promotion.service.VoucherDiscountTests \
            --tests com.fido.modules.pricing.PricingCalculatorTests \
            --tests com.fido.modules.order.service.lifecycle.OrderActionPolicyInvariantTests \
            --tests com.fido.modules.order.service.lifecycle.OrderActionMatrixTests \
            --tests com.fido.modules.order.service.lifecycle.OrderActionSchemaTests \
            --tests com.fido.modules.order.OrderActionContractHttpTests \
            --tests com.fido.modules.order.OrderActionTransactionHttpTests \
            --tests com.fido.modules.order.OrderStockHttpTests \
            --tests com.fido.modules.order.OrderLifecycleHttpTests \
            --tests com.fido.modules.product.service.query.PublicCatalogQueryServiceTests \
            --tests com.fido.modules.product.DynamicCatalogHttpTests \
            --tests com.fido.modules.product.ProductCoreHttpTests \
            --tests com.fido.modules.product.InventoryProductIdIntegrationTests \
            --tests com.fido.modules.product.ProductCreateWorkflowHttpTests
      - name: Test migration and mapping with MySQL
        id: mysql-tests
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/fido_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          TEST_DB_DRIVER: com.mysql.cj.jdbc.Driver
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: ci-only-password
        run: |
          if [ "$VIETNAMESE_ERRORS_FOCUSED" = "true" ]; then
            ./gradlew --no-daemon test --rerun-tasks \
              --tests 'com.fido.common.exception.*' \
              --tests com.fido.modules.account.AuthenticationProfileHttpTests \
              --tests com.fido.modules.order.OrderActionContractHttpTests \
              --tests com.fido.modules.order.CheckoutCartTransactionTests \
              --tests com.fido.modules.promotion.service.VoucherManagementContractTests \
              --tests com.fido.modules.content.ContentPageApiTest
            ./gradlew --no-daemon checkJavaFormat
          elif [ "$DOMAIN_ENTITY_FOCUSED" = "true" ]; then
            bash scripts/verify-order-without-shipping.sh
          elif [ "$CUSTOMER_CANCEL_FOCUSED" = "true" ]; then
            ./gradlew --no-daemon test --rerun-tasks \
              --tests com.fido.common.ApiBaselineRouteContractTests \
              --tests com.fido.modules.order.CustomerOrderCancellationHttpTests \
              --tests com.fido.modules.order.OrderActionContractHttpTests \
              --tests com.fido.modules.order.OrderActionTransactionHttpTests \
              --tests com.fido.modules.order.OrderConcurrencyTests \
              --tests com.fido.modules.order.OrderStockHttpTests \
              --tests com.fido.modules.order.OrderAuthorizationHttpTests \
              --tests com.fido.modules.order.OrderLifecycleHttpTests \
              --tests com.fido.modules.order.service.lifecycle.OrderActionPolicyInvariantTests \
              --tests com.fido.modules.order.service.lifecycle.OrderActionMatrixTests \
              --tests com.fido.modules.order.service.lifecycle.OrderActionSchemaTests \
              --tests com.fido.modules.order.service.lifecycle.OrderQueryServiceTests
            ./gradlew --no-daemon checkJavaFormat
          elif [ "$SEED_CATALOG_FOCUSED" = "true" ]; then
            ./gradlew --no-daemon test --rerun-tasks \
              --tests com.fido.config.devseed.DevDataSeedServiceTests \
              --tests com.fido.persistence.DatabaseBaselineTests.developmentFixtureSeedsParentChildAttributesAndInventory
            ./gradlew --no-daemon checkJavaFormat
          elif [ "$REPORT_FOCUSED" = "true" ]; then
            ./gradlew --no-daemon test --rerun-tasks \
              --tests 'com.fido.modules.report.*' \
              --tests 'com.fido.modules.pricing.*' \
              --tests com.fido.config.devseed.DevDataSeedServiceTests.reportsDistinguishSeedPeriodFromEmptyRecentRange \
              --tests com.fido.modules.promotion.service.VoucherDiscountTests
            ./gradlew --no-daemon checkJavaFormat
          else
            ./gradlew --no-daemon compileJava test check --rerun-tasks
          fi
      - name: Keep MySQL test reports
        if: always() && steps.mysql-tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: backend-mysql-test-reports
          path: backend/build/test-results/test
