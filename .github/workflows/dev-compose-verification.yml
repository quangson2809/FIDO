name: Dev Compose verification

on:
  push:
    branches:
      - fix/frontend-product-variant-selection
      - feature/admin-ui-ux-improvements
    paths:
      - "compose.yaml"
      - ".env.example"
      - "backend/.env.example"
      - "backend/build.gradle.kts"
      - "backend/src/main/java/com/fido/config/security/JwtConfig.java"
      - "backend/src/main/resources/**"
      - ".github/workflows/dev-compose-verification.yml"
  pull_request:
    branches:
      - main
    paths:
      - "compose.yaml"
      - ".env.example"
      - "backend/Dockerfile.dev"
      - "backend/.dockerignore"
      - "backend/.env.example"
      - "backend/build.gradle.kts"
      - "backend/src/main/java/com/fido/config/security/JwtConfig.java"
      - "backend/src/main/resources/application-dev.properties"
      - "frontend/Dockerfile.dev"
      - "frontend/.dockerignore"
      - ".github/workflows/dev-compose-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-compose-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: Build and boot development stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MYSQL_ROOT_PASSWORD: ci-compose-password
      MYSQL_DATABASE: fido
      MYSQL_TZ: UTC
      DOCKER_DB_URL: jdbc:mysql://db:3306/fido?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DOCKER_DB_USERNAME: root
      DOCKER_BACKEND_INTERNAL_PORT: "8080"
      BACKEND_PORT: "8080"
      FRONTEND_PORT: "5173"
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
      VITE_API_MODE: real
      VITE_API_BASE_URL: http://localhost:8080/api/v1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare CI backend settings
        run: |
          cp backend/.env.example backend/.env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci-compose-password/' backend/.env
          sed -i "s/^JWT_SECRET_BASE64=.*/JWT_SECRET_BASE64=$(openssl rand -base64 32)/" backend/.env

      - name: Show Docker Compose version
        run: docker compose version

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build development images
        run: docker compose build

      - name: Start development stack
        run: docker compose up -d

      - name: Wait for backend health
        shell: bash
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent --show-error http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time."
          docker compose logs backend
          exit 1

      - name: Wait for frontend
        shell: bash
        run: |
          for attempt in {1..45}; do
            if curl --fail --silent --show-error http://localhost:5173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become reachable in time."
          docker compose logs frontend
          exit 1

      - name: Show service state
        run: docker compose ps

      - name: Capture Compose logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop and remove verification stack
        if: always()
        run: docker compose down -v --remove-orphans
