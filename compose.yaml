name: fido-dev

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fido
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot --password=\"$$MYSQL_ROOT_PASSWORD\" --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    init: true
    working_dir: /workspace
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://db:3306/fido?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      SERVER_PORT: "8080"
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:${FRONTEND_PORT:-5173}"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend:/workspace
      - gradle_cache:/root/.gradle
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    init: true
    working_dir: /app
    environment:
      VITE_API_MODE: real
      VITE_API_BASE_URL: "http://localhost:${BACKEND_PORT:-8080}/api/v1"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - npm_cache:/root/.npm
    depends_on:
      - backend

volumes:
  mysql_data:
  gradle_cache:
  frontend_node_modules:
  npm_cache:
